<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Diário Secreto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container-toast"></div>

    <div id="tela-inicial" class="container-auth">
        <div class="card-auth">
            <div class="abas-auth">
                <button id="aba-entrar" class="aba ativa" onclick="mudarAbaAuth('login')">Entrar</button>
                <button id="aba-cadastrar" class="aba" onclick="mudarAbaAuth('cadastro')">Cadastrar</button>
            </div>

            <form id="form-autenticacao" onsubmit="event.preventDefault(); processarAutenticacao();">
                
                <div class="campo campo-cadastro" style="display: none;">
                    <label for="auth-nome">Nome Completo</label>
                    <input type="text" id="auth-nome" placeholder="Como quer ser chamado(a)?">
                </div>

                <div class="campo campo-cadastro" style="display: none;">
                    <label for="auth-genero">Gênero</label>
                    <select id="auth-genero">
                        <option value="" disabled selected>Selecione seu gênero</option>
                        <option value="Feminino">Feminino</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Outro">Outro / Prefiro não dizer</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="auth-email">E-mail</label>
                    <input type="email" id="auth-email" placeholder="seu@email.com">
                </div>

                <div class="campo">
                    <label for="auth-senha">Senha (4 a 7 dígitos)</label>
                    <div class="wrapper-senha">
                        <input type="password" id="auth-senha" placeholder="Digite sua senha" maxlength="8">
                        <button type="button" class="btn-ver-senha" onclick="alternarVisibilidadeSenha()">👁️</button>
                    </div>
                </div>

                <div class="campo campo-cadastro" style="display: none;">
                    <label id="lbl-auth-avatar" for="auth-avatar" class="btn-upload-placeholder">
                        📸 Adicionar Foto de Perfil (Opcional)
                    </label>
                    <input type="file" id="auth-avatar" accept="image/*" style="display: none;">
                </div>

                <button type="submit" id="btn-submit-auth" class="btn-principal">Entrar no Diário 🔑</button>
            </form>
        </div>
    </div>

    <div id="tela-diario" class="container-diario desativado">
        <header class="topo-diario">
            <div class="usuario-topo" onclick="abrirModalPerfil()">
                <div id="avatar-topo-img" class="avatar-circulo">
                    <span id="avatar-letras"></span>
                </div>
                <span class="boas-vindas">Olá, Diário!</span>
            </div>
            <button class="btn-sair" onclick="fazerLogout()">Trancar Diário 🔒</button>
        </header>

        <main class="conteudo-diario">
            <section class="card painel-config">
                <h3>Personalizar Aparência</h3>
                <div class="controles-config">
                    <div class="item-config">
                        <label for="select-tema">Tema:</label>
                        <select id="select-tema" onchange="mudarTema(this.value)"></select>
                    </div>
                    <div class="item-config">
                        <label for="select-fonte">Fonte:</label>
                        <select id="select-fonte" onchange="mudarFonte(this.value)">
                            <option value="'Georgia', serif">📜 Clássica (Georgia)</option>
                            <option value="'Courier New', monospace">📟 Máquina de Escrever</option>
                            <option value="'Arial', sans-serif">📱 Moderna Clean</option>
                            <option value="'Dancing Script', cursive">✍️ Manuscrita Romântica</option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="card secao-escrever">
                <h2>Como foi o seu dia?</h2>
                <form id="form-post" onsubmit="event.preventDefault();">
                    <div class="campo">
                        <input type="text" id="post-titulo" placeholder="Título da história de hoje...">
                    </div>
                    <div class="campo">
                        <textarea id="post-conteudo" placeholder="Comece a desabafar aqui..."></textarea>
                    </div>

                    <div class="escala-container">
                        <div class="item-escala">
                            <label>Alimentação Saudável: <span id="emoji-alimentacao-status">🥪</span> <strong id="valor-escala">3 / 5</strong></label>
                            <input type="range" id="escala-alimentacao" min="1" max="5" value="3" oninput="atualizarEscalaAlimentacao(this.value)">
                        </div>
                        <div class="item-escala">
                            <label>Foco na Dieta / Rotina: <span id="emoji-dieta-status">😐</span> <strong id="valor-dieta">3 / 5</strong></label>
                            <input type="range" id="escala-dieta" min="1" max="5" value="3" oninput="atualizarEscalaDieta(this.value)">
                        </div>
                    </div>

                    <button type="button" class="btn-principal">Salvar Página no Diário 💾</button>
                </form>
            </section>

            <section class="historico-posts">
                <h2>Suas Memórias Guardadas</h2>
                <div id="lista-de-posts">
                    </div>
            </section>
        </main>
    </div>

    <div id="modal-perfil" class="modal desativado" onclick="fecharModalPerfilComCliqueFora(event)">
        <div class="conteudo-modal">
            <button class="fechar-modal" onclick="fecharModalPerfil()">&times;</button>
            <h2>Meu Perfil</h2>
            
            <div class="avatar-perfil-wrapper">
                <div id="avatar-perfil-grande" class="avatar-circulo-grande">
                    <span id="avatar-letras-grande"></span>
                </div>
                <label for="perf-avatar-editar" class="btn-editar-foto">Alterar Foto</label>
                <input type="file" id="perf-avatar-editar" accept="image/*" style="display: none;">
            </div>

            <div class="info-usuario-modal">
                <p><strong>Nome:</strong> <span id="perf-nome"></span></p>
                <p><strong>E-mail:</strong> <span id="perf-email"></span></p>
                
                <div class="campo-modal">
                    <label for="perf-genero-editar">Gênero:</label>
                    <select id="perf-genero-editar" onchange="atualizarGeneroPerfil(this.value)">
                        <option value="Feminino">Feminino</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Outro">Outro / Prefiro não dizer</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
